name: Desktop (Tauri)

# Builds the Hermes desktop app — a Tauri shell wrapping the dashboard with a
# PyInstaller "onefile" Python sidecar — for macOS, Windows and Linux.
# Manual trigger only; flip `release` to true to attach installers to a draft
# GitHub Release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish installers to a draft GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packaging/desktop/tauri/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('packaging/desktop/tauri/src-tauri/Cargo.toml') }}

      # 1. Build the React SPA. vite.config.ts writes to hermes_cli/web_dist,
      #    which the spec packs into the sidecar.
      - name: Build web SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      # 2. Build the Python sidecar (onedir) with PyInstaller.
      - name: Build Python sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]" pyinstaller
          pyinstaller packaging/desktop/hermes-desktop.spec \
            --distpath packaging/desktop/dist \
            --workpath packaging/desktop/build \
            --noconfirm
        shell: bash

      # 3. Stage the onedir bundle as a Tauri resource.
      - name: Stage sidecar for Tauri
        run: |
          rm -rf packaging/desktop/tauri/src-tauri/sidecar
          cp -r packaging/desktop/dist/hermes-desktop \
                packaging/desktop/tauri/src-tauri/sidecar
        shell: bash

      - name: Install Tauri CLI
        working-directory: packaging/desktop/tauri
        run: npm install

      # 4. Build the Tauri app + installers. The icon set is committed under
      #    src-tauri/icons (regenerate with `npm run tauri icon <square.png>`).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packaging/desktop/tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ inputs.release && format('desktop-v{0}', github.run_number) || '' }}
          releaseName: ${{ inputs.release && 'Hermes Desktop' || '' }}
          releaseDraft: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.target }}
          path: |
            packaging/desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
