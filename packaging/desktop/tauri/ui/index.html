<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0d;
        color: #e7e7ea;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #2a2a30;
        border-top-color: #8b8bff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        font-size: 0.95rem;
        color: #9a9aa2;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div id="msg">Starting Hermes…</div>
    </div>
  </body>
</html>
